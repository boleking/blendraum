<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Twin Test – Platzhalter-Viewer für ein Thermenresort. Keine echten Daten." />
    <link rel="icon" href="data:," />
    <title>Twin Test</title>
  </head>
  <body>
    <canvas id="view" aria-label="3D-Ansicht des Platzhalter-Resorts" role="img"></canvas>

    <header class="topbar">
      <div class="brand">
        <h1 id="brand-title">Twin Test</h1>
        <p id="brand-sub">Platzhalter · keine echten Daten</p>
      </div>
      <div class="plan">
        <span class="scope" id="scope"></span>
        <div class="variant" role="group" aria-labelledby="scope">
          <button type="button" data-variant="bestand">Bestand</button>
          <button type="button" data-variant="neu">Neu</button>
        </div>
      </div>
    </header>

    <div class="zoom" id="zoom" role="group" aria-label="Zoom" hidden>
      <button type="button" id="zoom-in" aria-label="Hineinzoomen">+</button>
      <button type="button" id="zoom-out" aria-label="Herauszoomen">−</button>
    </div>

    <section class="sheet" id="panel" aria-label="Steuerung" hidden>
      <div class="where-row">
        <button type="button" id="prev" aria-label="Vorheriger Bereich">‹</button>
        <p class="where" id="where"></p>
        <button type="button" id="next" aria-label="Nächster Bereich">›</button>
      </div>

      <div class="stages" role="group" aria-label="Ansicht">
        <button type="button" data-stage="resort">Übersicht</button>
        <button type="button" data-stage="zone">Bereich</button>
        <button type="button" data-stage="ort">Ort</button>
        <button type="button" data-stage="schritt">Schritt</button>
      </div>

      <div class="zones" id="zones" role="group" aria-label="Bereich wählen"></div>

      <p class="hint">Pfeile, + / −, B / N · Wischen, Zwei-Finger-Zoom</p>
    </section>

    <div class="notice" id="notice" role="status">Lade Twin …</div>
    <p class="sr-only" id="live" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
